services:
  # Backend API Service
  - type: web
    name: surveypro-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3042
      - key: PLT_SERVER_HOSTNAME
        value: 0.0.0.0
      - key: PLT_SERVER_LOGGER_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: surveypro-db
          property: connectionString
      - key: PLT_ADMIN_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PLT_WATCH_ENABLED
        value: false

databases:
  # PostgreSQL with PostGIS
  - name: surveypro-db
    databaseName: surveypro
    user: surveypro
    postgresMajorVersion: 15
    plan: starter
